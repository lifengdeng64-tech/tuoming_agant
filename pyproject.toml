[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tuoming-agent"
version = "0.3.0"
description = "Local-first, privacy-preserving data analysis workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43.0",
    "duckdb>=1.4,<1.6",
    "httpx>=0.27,<1",
    "langchain-anthropic>=0.3,<1",
    "langchain-google-genai>=2,<3",
    "langchain-openai>=0.2.14,<1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0",
    "streamlit>=1.39",
    "xlsxwriter>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.3",
]
desktop = [
    "pillow>=10.4",
    "pyinstaller>=6.10",
    "pystray>=0.19.5",
]

[project.scripts]
tuoming-keygen = "tuoming_agent.keygen:main"
tuoming-agent = "tuoming_agent.desktop.launcher:main"

[tool.setuptools.packages.find]
include = ["tuoming_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "performance: opt-in large-file performance acceptance tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
