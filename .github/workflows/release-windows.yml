name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build, sign and verify
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          $requireSignature = "${{ startsWith(github.ref, 'refs/tags/') }}" -eq "true"
          ./scripts/build_windows.ps1 -RequireSignature:$requireSignature -RequireAntivirus:$requireSignature
          ./scripts/verify_windows_release.ps1 -RequireSignature:$requireSignature
      - uses: actions/upload-artifact@v4
        with:
          name: TuomingAgent-Windows
          path: |
            dist/TuomingAgent-Setup.exe
            dist/TuomingAgent-Setup.exe.sha256
            dist/TuomingAgent-Windows-x64.zip
            dist/TuomingAgent-Windows-x64.zip.sha256
      - name: Optional VirusTotal upload
        if: startsWith(github.ref, 'refs/tags/') && env.VT_API_KEY != ''
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          curl.exe --fail-with-body --request POST `
            --url https://www.virustotal.com/api/v3/files `
            --header "x-apikey: $env:VT_API_KEY" `
            --form "file=@dist/TuomingAgent-Setup.exe"
      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
            "dist/TuomingAgent-Setup.exe",
            "dist/TuomingAgent-Setup.exe.sha256",
            "dist/TuomingAgent-Windows-x64.zip",
            "dist/TuomingAgent-Windows-x64.zip.sha256"
          )
          if (gh release view $tag 2>$null) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --generate-notes --title "Tuoming Agent $tag"
          }